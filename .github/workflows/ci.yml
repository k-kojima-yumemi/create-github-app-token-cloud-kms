name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: 12

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'package.json'

      - run: curl -fsSL https://raw.githubusercontent.com/AikidoSec/safe-chain/main/install-scripts/install-safe-chain.sh | sh -s -- --ci

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format & Lint
        id: npm-check
        run: npm run check

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-slim
    environment:
      name: demo
      deployment: false
    needs: 
      - test-typescript

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          kms-key-name: ${{ secrets.KMS_KEY_NAME }}
          permission-contents: read
          repositories: |
            ${{ github.repository }}
            k-kojima-yumemi/create-github-app-token-cloud-kms-private-demo

      - name: Verify Token (current repository)
        id: verify-current-repo
        env:
          TOKEN: ${{ steps.test-action.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_STATUS: "200"
        run: node .github/scripts/verify-token-readme.mjs

      - name: Verify Token (private demo repository)
        id: verify-private-demo
        env:
          TOKEN: ${{ steps.test-action.outputs.token }}
          REPOSITORY: k-kojima-yumemi/create-github-app-token-cloud-kms-private-demo
          EXPECTED_STATUS: "200"
        run: node .github/scripts/verify-token-readme.mjs

  test-action-default-repositories:
    name: GitHub Actions Test (default repositories)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-slim
    environment:
      name: demo
      deployment: false
    needs:
      - test-typescript

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          kms-key-name: ${{ secrets.KMS_KEY_NAME }}
          permission-contents: read

      - name: Verify Token (current repository)
        id: verify-current-repo
        env:
          TOKEN: ${{ steps.test-action.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_STATUS: "200"
        run: node .github/scripts/verify-token-readme.mjs

      - name: Verify Token cannot read private demo (404)
        id: verify-private-demo-inaccessible
        env:
          TOKEN: ${{ steps.test-action.outputs.token }}
          REPOSITORY: k-kojima-yumemi/create-github-app-token-cloud-kms-private-demo
          EXPECTED_STATUS: "404"
        run: node .github/scripts/verify-token-readme.mjs

  test-minimal-typescript:
    name: Minimal TypeScript Tests
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: minimal
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: 'minimal/package.json'
      - run: curl -fsSL https://raw.githubusercontent.com/AikidoSec/safe-chain/main/install-scripts/install-safe-chain.sh | sh -s -- --ci
      - name: Install Dependencies
        run: npm ci
      - name: Check Format & Lint
        run: npm run check
      - name: Test
        run: npm test

  test-minimal-action:
    name: Minimal GitHub Actions Test
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-slim
    environment:
      name: demo
      deployment: false
    needs: 
      - test-minimal-typescript

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test Local Action
        id: test-action
        uses: ./minimal
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          kms-key-name: ${{ secrets.KMS_KEY_NAME }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          repositories: |
            ${{ github.repository }}
            k-kojima-yumemi/create-github-app-token-cloud-kms-private-demo
      - name: Verify Token (current repository)
        id: verify-current-repo
        env:
          TOKEN: ${{ steps.test-action.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_STATUS: "200"
        run: node .github/scripts/verify-token-readme.mjs
      - name: Verify Token (private demo repository)
        id: verify-private-demo
        env:
          TOKEN: ${{ steps.test-action.outputs.token }}
          REPOSITORY: k-kojima-yumemi/create-github-app-token-cloud-kms-private-demo
          EXPECTED_STATUS: "200"
        run: node .github/scripts/verify-token-readme.mjs

  test-minimal-action-default-repositories:
    name: Minimal GitHub Actions Test (default repositories)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-slim
    environment:
      name: demo
      deployment: false
    needs: 
      - test-minimal-typescript

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test Local Action
        id: test-action
        uses: ./minimal
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          kms-key-name: ${{ secrets.KMS_KEY_NAME }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          repositories: |
            ${{ github.repository }}
            k-kojima-yumemi/create-github-app-token-cloud-kms-private-demo
      - name: Verify Token (current repository)
        id: verify-current-repo
        env:
          TOKEN: ${{ steps.test-action.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_STATUS: "200"
        run: node .github/scripts/verify-token-readme.mjs
      - name: Verify Token (private demo repository)
        id: verify-private-demo
        env:
          TOKEN: ${{ steps.test-action.outputs.token }}
          REPOSITORY: k-kojima-yumemi/create-github-app-token-cloud-kms-private-demo
          EXPECTED_STATUS: "200"
        run: node .github/scripts/verify-token-readme.mjs
      