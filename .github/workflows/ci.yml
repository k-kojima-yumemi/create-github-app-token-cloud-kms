name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format & Lint
        id: npm-check
        run: npm run check

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-slim
    environment:
      name: demo
      deployment: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          kms-key-name: ${{ secrets.KMS_KEY_NAME }}
          permission-contents: read
          repositories: |
            ${{ github.repository }}
            k-kojima-yumemi/create-github-app-token-cloud-kms-private-demo

      - name: Verify Token
        id: verify
        env:
          TOKEN: ${{ steps.test-action.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PRIVATE_DEMO_REPOSITORY: k-kojima-yumemi/create-github-app-token-cloud-kms-private-demo
        run: |
          node --input-type=module << 'EOF'
          const { TOKEN, GITHUB_REPOSITORY, PRIVATE_DEMO_REPOSITORY } = process.env;

          async function readReadme(repo) {
            const res = await fetch(`https://api.github.com/repos/${repo}/contents/README.md`, {
              headers: { Authorization: `token ${TOKEN}`, Accept: 'application/vnd.github+json' },
            });
            if (!res.ok) throw new Error(`Failed to read README.md in ${repo}: ${res.status}`);
            const { content, encoding } = await res.json();
            console.log(`[${repo}]`, Buffer.from(content, encoding).toString('utf-8').trim().slice(0, 100));
          }

          await readReadme(GITHUB_REPOSITORY);
          await readReadme(PRIVATE_DEMO_REPOSITORY);
          EOF
