name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-slim

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format & Lint
        id: npm-check
        run: npm run check

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-slim
    environment:
      name: demo
      deployment: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          kms-key-name: ${{ secrets.KMS_KEY_NAME }}
          permission-contents: read
          repositories: |
            ${{ github.repository }}
            k-kojima-yumemi/create-github-app-token-cloud-kms-private-demo

      - name: Verify Token (current repository)
        id: verify-current-repo
        env:
          TOKEN: ${{ steps.test-action.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/verify-token-readme.mjs

      - name: Verify Token (private demo repository)
        id: verify-private-demo
        env:
          TOKEN: ${{ steps.test-action.outputs.token }}
          REPOSITORY: k-kojima-yumemi/create-github-app-token-cloud-kms-private-demo
        run: node .github/scripts/verify-token-readme.mjs
