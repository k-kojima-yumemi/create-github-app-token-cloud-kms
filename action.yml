name: Create GitHub App Token (Cloud KMS)
description: Creates a GitHub App installation token using Cloud KMS for JWT signing
author: Kojima Kohei

branding:
  icon: cloud
  color: blue

inputs:
  client-id:
    description: GitHub App Client ID
    required: true
  kms-key-name:
    description: >-
      Cloud KMS key version resource name
      (projects/.../keyRings/.../cryptoKeys/.../cryptoKeyVersions/...)
    required: true
  repositories:
    description: >-
      Comma or newline-separated list of repositories to grant access to.
      Defaults to the current repository.
    required: false

outputs:
  token:
    description: GitHub App installation access token

runs:
  using: node24
  main: dist/index.js
  post: dist/post.js
  post-if: always()
